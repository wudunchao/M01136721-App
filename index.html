<script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          lessons: []
        }
      },
      mounted() {
        // Fetch lessons from local Node.js backend
        fetch('http://localhost:3000/lessons')
          .then(res => res.json())
          .then(data => {
            this.lessons = data;
          })
          .catch(err => console.error(err));
      }
    }).mount('#app');
  </script>
